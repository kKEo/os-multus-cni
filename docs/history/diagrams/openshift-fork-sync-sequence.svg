<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 400" data-svgdog="1" font-family="Inter, sans-serif">
  <title>A downstream sync</title>
  <desc>An engineer merges upstream master into a sync branch, Prow CI tests it, an OWNERS approver merges it into the fork's main branch, and ART rebuilds the image; the ART bot also keeps base images aligned per release.</desc>
  <style>@media (prefers-color-scheme: dark){.f-bg{fill:#0d1117}.f-ed{fill:#e5e7eb}.f-nf{fill:#1e293b}.f-tx{fill:#e5e7eb}.s-ed{stroke:#e5e7eb}.s-mu{stroke:#94a3b8}.s-ns{stroke:#94a3b8}}</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937" class="f-ed"/></marker>
  </defs>
  <rect x="0" y="0" width="904" height="400" fill="#ffffff" class="f-bg"/>
  <g id="node-up">
    <line x1="80" y1="104" x2="80" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <rect x="24" y="24" width="112" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="80" y="59.09">Upstream</tspan><tspan x="80" y="79.09">master</tspan></text>
  </g>
  <g id="node-eng">
    <line x1="240" y1="104" x2="240" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <rect x="176" y="24" width="128" height="80" rx="40" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="240" y="59.09">OpenShift</tspan><tspan x="240" y="79.09">engineer</tspan></text>
  </g>
  <g id="node-ci">
    <line x1="440" y1="104" x2="440" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <rect x="376" y="24" width="128" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="440" y="59.09">Prow CI</tspan><tspan x="440" y="79.09">(ci-operator)</tspan></text>
  </g>
  <g id="node-fork">
    <line x1="600" y1="104" x2="600" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <rect x="544" y="56" width="112" height="48" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="600" y="85.09" text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx">Fork main</text>
  </g>
  <g id="node-bot">
    <line x1="808" y1="104" x2="808" y2="376" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <rect x="736" y="24" width="144" height="80" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="808" y="59.09">openshift-bot</tspan><tspan x="808" y="79.09">(ART)</tspan></text>
  </g>
  <g id="edge-eng--up">
    <path d="M240 144 L80 144" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="160" y="136.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">fetch master</text>
  </g>
  <g id="edge-eng--fork">
    <path d="M240 184 L600 184" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="340" y="176.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">open sync PR</text>
  </g>
  <g id="edge-fork--ci">
    <path d="M600 224 L440 224" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="520" y="216.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">run e2e / unit tests</text>
  </g>
  <g id="edge-ci--fork">
    <path d="M440 264 L600 264" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)" class="s-ed"/>
    <text x="520" y="256.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">green</text>
  </g>
  <g id="edge-merge">
    <path d="M240 304 L600 304" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="340" y="296.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">approve (OWNERS) + merge</text>
  </g>
  <g id="edge-bot--fork">
    <path d="M808 344 L600 344" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="704" y="336.11" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">align base images per release</text>
  </g>
</svg>
