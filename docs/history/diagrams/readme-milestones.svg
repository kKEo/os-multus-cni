<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 464" data-svgdog="1" font-family="Inter, sans-serif">
  <title>Multus CNI milestones</title>
  <desc>From the Intel initial commit in 2016, through the NPWG standard, v3.0, the move to the k8snetworkplumbingwg organization, the v4 thick plugin and DRA, to auxiliary CNI chains in 2024.</desc>
  <style>@media (prefers-color-scheme: dark){.f-af{fill:#60a5fa}.f-at{fill:#0d1117}.f-bg{fill:#0d1117}.f-mu{fill:#94a3b8}.f-nf{fill:#1e293b}.f-tx{fill:#e5e7eb}.s-ed{stroke:#e5e7eb}.s-mu{stroke:#94a3b8}.s-ns{stroke:#94a3b8}}</style>
  <rect x="0" y="0" width="944" height="464" fill="#ffffff" class="f-bg"/>
  <g id="group-intel">
    <rect x="24" y="24" width="288" height="188" rx="8" fill="none" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <text x="36" y="48.37" font-size="12" fill="#6b7280" class="f-mu">Intel era</text>
  </g>
  <g id="group-std">
    <rect x="344" y="24" width="528" height="188" rx="8" fill="none" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <text x="356" y="48.37" font-size="12" fill="#6b7280" class="f-mu">Standardisation</text>
  </g>
  <g id="group-comm">
    <rect x="24" y="252" width="896" height="188" rx="8" fill="none" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <text x="36" y="276.37" font-size="12" fill="#6b7280" class="f-mu">Community era</text>
  </g>
  <g id="axis">
    <line x1="72" y1="92" x2="808" y2="92" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" class="s-ed"/>
    <line x1="120" y1="320" x2="864" y2="320" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" class="s-ed"/>
  </g>
  <g id="node-init">
    <line x1="96" y1="92" x2="96" y2="116" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="96" cy="92" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="96" y="76.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Dec 2016</text>
    <rect x="40" y="116" width="112" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="96" y="151.09">Intel initial</tspan><tspan x="96" y="171.09">commit</tspan></text>
  </g>
  <g id="node-crd">
    <line x1="240" y1="92" x2="240" y2="116" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="240" cy="92" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="240" y="76.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Nov 2017</text>
    <rect x="184" y="116" width="112" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="240" y="151.09">First CRD</tspan><tspan x="240" y="171.09">support</tspan></text>
  </g>
  <g id="node-npwg">
    <line x1="432" y1="92" x2="432" y2="116" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="432" cy="92" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="432" y="76.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">2018</text>
    <rect x="360" y="116" width="144" height="80" fill="#2563eb" stroke="#1f2937" stroke-width="1.5" class="f-af s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#ffffff" class="f-at"><tspan x="432" y="151.09">NPWG spec v1</tspan><tspan x="432" y="171.09">adopted</tspan></text>
  </g>
  <g id="node-v3">
    <line x1="608" y1="92" x2="608" y2="116" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="608" cy="92" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="608" y="76.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Jul 2018</text>
    <rect x="536" y="116" width="144" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="608" y="145.09" text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx">v3.0 released</text>
  </g>
  <g id="node-ocp">
    <line x1="784" y1="92" x2="784" y2="116" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="784" cy="92" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="784" y="76.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Dec 2018</text>
    <rect x="712" y="116" width="144" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="784" y="151.09">OpenShift build</tspan><tspan x="784" y="171.09">files</tspan></text>
  </g>
  <g id="node-org">
    <line x1="144" y1="320" x2="144" y2="344" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="144" cy="320" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="144" y="304.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Mar 2021</text>
    <rect x="40" y="344" width="208" height="80" fill="#2563eb" stroke="#1f2937" stroke-width="1.5" class="f-af s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#ffffff" class="f-at"><tspan x="144" y="379.09">Moved to</tspan><tspan x="144" y="399.09">k8snetworkplumbingwg</tspan></text>
  </g>
  <g id="node-thick">
    <line x1="344" y1="320" x2="344" y2="344" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="344" cy="320" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="344" y="304.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Dec 2021</text>
    <rect x="280" y="344" width="128" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="344" y="379.09">Thick plugin</tspan><tspan x="344" y="399.09">refactor</tspan></text>
  </g>
  <g id="node-v4">
    <line x1="512" y1="320" x2="512" y2="344" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="512" cy="320" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="512" y="304.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Apr 2023</text>
    <rect x="440" y="344" width="144" height="80" fill="#2563eb" stroke="#1f2937" stroke-width="1.5" class="f-af s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#ffffff" class="f-at"><tspan x="512" y="379.09">v4 module and</tspan><tspan x="512" y="399.09">release</tspan></text>
  </g>
  <g id="node-dra">
    <line x1="680" y1="320" x2="680" y2="344" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="680" cy="320" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="680" y="304.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Jun 2023</text>
    <rect x="616" y="344" width="128" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="680" y="373.09" text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx">DRA support</text>
  </g>
  <g id="node-aux">
    <line x1="840" y1="320" x2="840" y2="344" stroke="#6b7280" stroke-width="1" class="s-mu"/>
    <circle cx="840" cy="320" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5" class="f-bg s-ns"/>
    <text x="840" y="304.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">Aug 2024</text>
    <rect x="776" y="344" width="128" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="840" y="379.09">Auxiliary CNI</tspan><tspan x="840" y="399.09">chain</tspan></text>
  </g>
</svg>
