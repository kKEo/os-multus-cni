<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A multi-homed pod with Multus CNI</title>
  <desc>The pod's eth0 interface is attached to the default cluster network and carries probes and API server traffic. Multus adds the secondary interfaces net1 and net2, each attached to an additional network described by a NetworkAttachmentDefinition, for specific user traffic.</desc>
  <style>@media (prefers-color-scheme: dark){.f-ac{fill:#60a5fa}.f-bg{fill:#0d1117}.f-mu{fill:#94a3b8}.f-nf{fill:#1e293b}.f-tx{fill:#e5e7eb}.s-ac{stroke:#60a5fa}.s-ed{stroke:#e5e7eb}.s-mu{stroke:#94a3b8}.s-ns{stroke:#94a3b8}}</style>
  <rect x="0" y="0" width="1100" height="400" fill="#ffffff" class="f-bg"/>

  <!-- Additional networks -->
  <g id="group-additional-networks">
    <rect x="16" y="64" width="176" height="240" rx="8" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4" class="s-mu"/>
    <text x="28" y="88" font-size="12" fill="#6b7280" class="f-mu">Additional networks</text>
    <rect x="28" y="108" width="152" height="56" rx="28" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="104" y="141" font-size="14" text-anchor="middle" fill="#1f2937" class="f-tx">Network 1</text>
    <rect x="28" y="204" width="152" height="56" rx="28" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="104" y="237" font-size="14" text-anchor="middle" fill="#1f2937" class="f-tx">Network 2</text>
  </g>

  <!-- Secondary attachments -->
  <g id="edges-secondary" stroke="#2563eb" stroke-width="2" class="s-ac">
    <line x1="180" y1="136" x2="420" y2="136"/>
    <line x1="180" y1="232" x2="420" y2="232"/>
  </g>
  <text x="306" y="181" font-size="13" text-anchor="middle" fill="#1f2937" class="f-tx">NetworkAttachmentDefinition</text>
  <text x="306" y="199" font-size="12" text-anchor="middle" fill="#6b7280" class="f-mu">one per additional network</text>

  <!-- Pod -->
  <g id="node-pod">
    <rect x="464" y="64" width="272" height="240" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="600" y="98" font-size="16" font-weight="600" text-anchor="middle" fill="#1f2937" class="f-tx">Pod</text>
    <rect x="536" y="148" width="128" height="72" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="1" class="f-bg s-ns"/>
    <text x="600" y="189" font-size="14" text-anchor="middle" fill="#1f2937" class="f-tx">containers</text>
    <text x="600" y="278" font-size="12" text-anchor="middle" fill="#6b7280" class="f-mu">one network namespace</text>
  </g>

  <!-- Interfaces -->
  <g id="interfaces" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="420" y="118" width="88" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="f-bg s-ac"/>
    <text x="464" y="141" fill="#1f2937" class="f-tx">net1</text>
    <rect x="420" y="214" width="88" height="36" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" class="f-bg s-ac"/>
    <text x="464" y="237" fill="#1f2937" class="f-tx">net2</text>
    <rect x="692" y="166" width="88" height="36" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2" class="f-bg s-ed"/>
    <text x="736" y="189" fill="#1f2937" class="f-tx">eth0</text>
  </g>

  <!-- Default network -->
  <line id="edge-primary" x1="780" y1="184" x2="900" y2="184" stroke="#1f2937" stroke-width="2" class="s-ed"/>
  <text x="840" y="174" font-size="13" text-anchor="middle" fill="#1f2937" class="f-tx">default network</text>

  <!-- Kubernetes cluster -->
  <g id="node-cluster">
    <rect x="900" y="88" width="184" height="192" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <g id="kubernetes-mark">
      <polygon points="992,112 1015.5,123.3 1021.2,148.7 1005,169 979,169 962.8,148.7 968.5,123.3" fill="#326ce5" stroke="#326ce5" stroke-width="8" stroke-linejoin="round"/>
      <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
        <circle cx="992" cy="142" r="12"/>
        <path d="M992 142L992 122M992 142L1007.6 129.5M992 142L1011.5 146.5M992 142L1000.7 160M992 142L983.3 160M992 142L972.5 146.5M992 142L976.4 129.5"/>
      </g>
      <circle cx="992" cy="142" r="3.5" fill="#ffffff"/>
    </g>
    <text x="992" y="214" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2937" class="f-tx">Kubernetes cluster</text>
    <text x="992" y="236" font-size="12" text-anchor="middle" fill="#6b7280" class="f-mu">API server, kubelet,</text>
    <text x="992" y="254" font-size="12" text-anchor="middle" fill="#6b7280" class="f-mu">Services, other pods</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <line x1="16" y1="340" x2="40" y2="340" stroke="#2563eb" stroke-width="2" class="s-ac"/>
    <text x="50" y="344.5" font-size="13" font-weight="600" fill="#1f2937" class="f-tx">Secondary interfaces (added by Multus)</text>
    <text x="50" y="364" font-size="12" fill="#6b7280" class="f-mu">Specific user traffic: data plane, storage, ...</text>
    <line x1="760" y1="340" x2="784" y2="340" stroke="#1f2937" stroke-width="2" class="s-ed"/>
    <text x="794" y="344.5" font-size="13" font-weight="600" fill="#1f2937" class="f-tx">Primary interface</text>
    <text x="794" y="364" font-size="12" fill="#6b7280" class="f-mu">Liveness and readiness probes,</text>
    <text x="794" y="381" font-size="12" fill="#6b7280" class="f-mu">API server to pod communication</text>
  </g>
</svg>
