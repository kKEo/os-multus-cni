<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 664" data-svgdog="1" font-family="Inter, sans-serif">
  <title>The code path of a CNI ADD</title>
  <desc>The thin binary calls multus.CmdAdd directly; the thick shim posts the request over a Unix socket to the daemon, which calls the same function. CmdAdd loads the configuration, builds the delegate list from the pod annotations, invokes each delegate and publishes the network status.</desc>
  <style>@media (prefers-color-scheme: dark){.f-af{fill:#60a5fa}.f-at{fill:#0d1117}.f-bg{fill:#0d1117}.f-ed{fill:#e5e7eb}.f-nf{fill:#1e293b}.f-tx{fill:#e5e7eb}.s-ed{stroke:#e5e7eb}.s-ns{stroke:#94a3b8}}</style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937" class="f-ed"/></marker>
  </defs>
  <rect x="0" y="0" width="928" height="664" fill="#ffffff" class="f-bg"/>
  <g id="node-thin">
    <rect x="288" y="24" width="128" height="96" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <line x1="288" y1="40" x2="416" y2="40" stroke="#1f2937" stroke-width="1.5" class="s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="352" y="75.09">cmd/multus</tspan><tspan x="352" y="95.09">(thin plugin)</tspan></text>
  </g>
  <g id="node-shim">
    <rect x="448" y="24" width="160" height="96" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <line x1="448" y1="40" x2="608" y2="40" stroke="#1f2937" stroke-width="1.5" class="s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="528" y="75.09">cmd/multus-shim</tspan><tspan x="528" y="95.09">pkg/server/api</tspan></text>
  </g>
  <g id="node-daemon">
    <rect x="432" y="168" width="192" height="80" rx="8" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="528" y="203.09">cmd/multus-daemon</tspan><tspan x="528" y="223.09">pkg/server</tspan></text>
  </g>
  <g id="node-cmdadd">
    <rect x="344" y="296" width="192" height="80" rx="8" fill="#2563eb" stroke="#1f2937" stroke-width="1.5" class="f-af s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#ffffff" class="f-at"><tspan x="440" y="331.09">multus.CmdAdd</tspan><tspan x="440" y="351.09">pkg/multus/multus.go</tspan></text>
  </g>
  <g id="node-conf" data-step="1">
    <rect x="24" y="432" width="176" height="80" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="112" y="467.09">types.LoadNetConf</tspan><tspan x="112" y="487.09">pkg/types/conf.go</tspan></text>
    <circle cx="24" cy="432" r="9" fill="#2563eb" data-badge="1" class="f-af"/>
    <text x="24" y="436.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">1</text>
  </g>
  <g id="node-k8s" data-step="2">
    <rect x="232" y="424" width="192" height="96" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="328" y="457.09">k8sclient:</tspan><tspan x="328" y="477.09">GetDefaultNetworks,</tspan><tspan x="328" y="497.09">TryLoadPodDelegates</tspan></text>
    <circle cx="232" cy="424" r="9" fill="#2563eb" data-badge="2" class="f-af"/>
    <text x="232" y="428.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">2</text>
  </g>
  <g id="node-deleg" data-step="3">
    <rect x="456" y="424" width="176" height="96" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx"><tspan x="544" y="457.09">DelegateAdd</tspan><tspan x="544" y="477.09">(libcni executes the</tspan><tspan x="544" y="497.09">plugin)</tspan></text>
    <circle cx="456" cy="424" r="9" fill="#2563eb" data-badge="3" class="f-af"/>
    <text x="456" y="428.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">3</text>
  </g>
  <g id="node-status" data-step="4">
    <rect x="664" y="448" width="240" height="48" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5" class="f-nf s-ns"/>
    <text x="784" y="477.09" text-anchor="middle" font-size="14" fill="#1f2937" class="f-tx">k8sclient.SetNetworkStatus</text>
    <circle cx="664" cy="448" r="9" fill="#2563eb" data-badge="4" class="f-af"/>
    <text x="664" y="452.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">4</text>
  </g>
  <g id="edge-thin--cmdadd">
    <path d="M360 120 L360 296" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="edge-shim--daemon">
    <path d="M528 120 L528 168" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
    <text x="609.81" y="148.37" text-anchor="middle" font-size="12" fill="#1f2937" class="f-tx">HTTP over a Unix socket</text>
  </g>
  <g id="edge-daemon--cmdadd">
    <path d="M520 248 L520 296" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="edge-cmdadd--conf">
    <path d="M360 376 L360 408 L112 408 L112 432" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="edge-cmdadd--k8s">
    <path d="M376 376 L376 400 L328 400 L328 424" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="edge-cmdadd--deleg">
    <path d="M504 376 L504 400 L544 400 L544 424" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="edge-cmdadd--status">
    <path d="M520 376 L520 392 L784 392 L784 448" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)" class="s-ed"/>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="561" r="9" fill="#2563eb" data-badge="1" class="f-af"/>
      <text x="33" y="565.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">1</text>
      <text x="52" y="565.37" font-size="12" fill="#1f2937" class="f-tx">Parse the Multus configuration received on stdin.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="587" r="9" fill="#2563eb" data-badge="2" class="f-af"/>
      <text x="33" y="591.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">2</text>
      <text x="52" y="591.37" font-size="12" fill="#1f2937" class="f-tx">Build the delegate list: cluster network first, then one delegate per attachment.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="613" r="9" fill="#2563eb" data-badge="3" class="f-af"/>
      <text x="33" y="617.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">3</text>
      <text x="52" y="617.37" font-size="12" fill="#1f2937" class="f-tx">Run every delegate in order; roll back with DEL if one fails.</text>
    </g>
    <g id="step-4">
      <circle cx="33" cy="639" r="9" fill="#2563eb" data-badge="4" class="f-af"/>
      <text x="33" y="643.37" text-anchor="middle" font-size="12" fill="#ffffff" class="f-at">4</text>
      <text x="52" y="643.37" font-size="12" fill="#1f2937" class="f-tx">Write the network-status annotation and return the default network result.</text>
    </g>
  </g>
</svg>
